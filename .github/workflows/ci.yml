name: CI and container image

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.99.1
  IMAGE: ghcr.io/tigrisdata/auxesia

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +"$RUST_VERSION" fmt --all -- --check
      - name: Run Clippy
        run: cargo +"$RUST_VERSION" clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo +"$RUST_VERSION" test --locked --workspace --all-features

  container:
    name: Container smoke test (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: auxesia:smoke
      - name: Check bundled documentation and skill
        run: |
          set -euo pipefail
          docker run --detach --name auxesia-smoke --publish 127.0.0.1:8080:8080 auxesia:smoke
          trap 'docker logs auxesia-smoke; docker rm --force auxesia-smoke' EXIT
          test "$(docker exec auxesia-smoke id -u)" = 65532
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/ -o /tmp/index.html
          grep -q '<html' /tmp/index.html
          curl --fail --silent --show-error -H 'Accept: text/markdown' http://127.0.0.1:8080/ -o /tmp/index.md
          cmp docs/index.md /tmp/index.md
          curl --fail --silent --show-error http://127.0.0.1:8080/llms.txt -o /tmp/llms.txt
          grep -q '/skills/serve-auxesia' /tmp/llms.txt
          curl --fail --silent --show-error http://127.0.0.1:8080/skills/serve-auxesia.skill -o /tmp/serve-auxesia.skill
          unzip -t /tmp/serve-auxesia.skill

  publish:
    name: Publish container image
    needs: [rust, container]
    if: github.event_name == 'push' && github.repository == 'tigrisdata/auxesia'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
