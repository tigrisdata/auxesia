[package]
name = "auxesia"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
# `Bytes::from_owner` shares cached content with responses without copying.
bytes = "1.9"
http-body = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
clap = { version = "4", features = ["derive"] }
comrak = { version = "0.57", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
globset = "0.4"
sha2 = "0.10"
mime_guess = "2"
percent-encoding = "2"
zip = { version = "6", default-features = false, features = ["deflate"] }
mcpkit-axum = "0.7"
mcpkit-server = "0.7"
mcpkit-core = "0.7"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "webp"] }

resvg = "0.49"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
